name: Build and push RL-arm training image

# Builds docker/Dockerfile and pushes to GHCR. Only triggers on changes to
# docker/ (or manual dispatch) — the flash-attn compile step makes this a
# genuinely slow build (expect ~1-2.5h on a first/cold run; GHA layer caching
# makes later builds much faster as long as earlier Dockerfile layers didn't
# change). No secrets to configure: GITHUB_TOKEN already has GHCR push rights
# for this repo.

on:
  push:
    branches: [main]
    paths:
      - "docker/**"
      - ".github/workflows/build-image.yml"
    tags:
      - "rl-arm-image-v*"
  workflow_dispatch: {}

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/es-capacity-rl-arm

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free up runner disk space
        # This image is large (three CUDA/torch venvs); the default GH-hosted
        # runner disk fills up without trimming preinstalled toolchains we
        # don't use (Android SDK, .NET, GHC, extra Docker images).
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet /opt/hostedtoolcache/CodeQL
          docker image prune -af

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=ref,event=tag

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
