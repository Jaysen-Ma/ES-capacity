# Template for other machines. Copy to configs/machine/<name>.toml and adjust.

[machine]
name = "example"
arch = "x86_64"
num_gpus = 1
gpu_name = "NVIDIA-GPU"
compute_capability = "8.0"
cuda_version = "12.4"
unified_memory_gb = 80
shm_gb = 16
num_cpus = 16

[vllm]
backend = "offline"
dtype = "bfloat16"
gpu_memory_utilization = 0.85
max_model_len = 4096
enable_prefix_caching = true
tensor_parallel_size = 1
image = "vllm/vllm-openai:latest"
port = 8000
container_name = "es-capacity-vllm"
api_key = "EMPTY"

[grade]
num_workers = 8
timeout_sec = 3.0

[seed]
base = 0
