# Committed machine profile: NVIDIA DGX Spark GB10 (this box).
# Absolute paths live in config.local.toml, not here.

[machine]
name = "gb10"
arch = "aarch64"
num_gpus = 1
gpu_name = "NVIDIA GB10"
compute_capability = "12.1"
# torch arch list omits sm_121 → forward-compat / PTX
cuda_version = "13.0"
unified_memory_gb = 121
shm_gb = 61
num_cpus = 20

[vllm]
backend = "offline"          # offline | server
dtype = "bfloat16"
gpu_memory_utilization = 0.85
max_model_len = 4096
enable_prefix_caching = true
tensor_parallel_size = 1
# Docker fallback image (server backend)
image = "vllm/vllm-openai:gemma4-cu130"
port = 8000
container_name = "es-capacity-vllm"
api_key = "EMPTY"

[grade]
num_workers = 16
timeout_sec = 3.0

[seed]
base = 0
