[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "es-capacity"
version = "0.1.0"
description = "Does ES post-training expand LLM reasoning capacity beyond the base model?"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Jaysen Ma" }]
dependencies = [
    "numpy",
    "matplotlib",
    "tqdm",
    "regex",
    "word2number",
    "pebble",
    "timeout-decorator",
    "datasets",
    "accelerate",
    "openai",
    "huggingface_hub",
    "safetensors",
    "peft",
    "tyro",
    # Install grading pins separately with --no-deps to avoid torch resolver fights:
    #   pip install --no-deps 'sympy==1.12' 'antlr4-python3-runtime==4.11.1'
    #   pip install -e third_party/yue_math/latex2sympy --no-deps
    # Machine-provided (docs/ENVIRONMENT.md): torch, transformers, vllm, ray, triton
]

[project.optional-dependencies]
dev = ["ipython", "pytest", "ruff"]

[project.scripts]
es-eval = "es_capacity.cli.eval:main"
es-aggregate = "es_capacity.cli.aggregate:main"
es-figures = "es_capacity.cli.figures:main"
es-train-eggroll = "es_capacity.cli.train_eggroll:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["es_capacity*", "third_party*"]

[tool.setuptools.package-data]
"third_party.yue_math" = ["**/*"]
